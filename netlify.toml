[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # Fuerza HTTPS por 2 años, incluye subdominios
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Bloquea carga en iframes (clickjacking)
    X-Frame-Options = "DENY"
    # Evita MIME-sniffing en browsers
    X-Content-Type-Options = "nosniff"
    # No filtra la URL completa a terceros
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permisos de features del browser
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: solo scripts del mismo origen + CDNs usados en la app
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://oraculo.octavocielo.com.ar https://api.mercadopago.com https://nominatim.openstreetmap.org https://timeapi.io https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'"
